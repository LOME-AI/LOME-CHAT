packages:
  - apps/*
  - packages/*
  - services/*
  - mocks/*
  - e2e
  - ops
  - scripts
  - ads

# Overrides live here as of pnpm 10.26 (the package.json "pnpm" field is no longer read).
# sharp is deduped to a single copy (transitive consumers otherwise each bundle their own
# heavy native binary); vite is redirected to the rolldown-vite drop-in workspace-wide. The
# rest pin security patches that exact-pinning parents (concurrently>shell-quote,
# typed-rest-client>qs, replace>minimatch, yaml-language-server>yaml, drizzle-orm>kysely)
# cannot pick up on their own. All stay within the parent's major.
overrides:
  kysely: ^0.28.17
  minimatch@<3.1.4: ^3.1.5
  qs: ^6.15.2
  sharp: ^0.34.5
  shell-quote: ^1.8.4
  vite: npm:rolldown-vite@7.3.1
  yaml: ^2.9.0

# @huggingface/transformers imports `onnxruntime-common` as a bare specifier its own
# manifest never declares. Declaring the edge here is what turns the shipped ORT version
# into a decision instead of a pnpm hoist-order outcome: pnpm merges this into the
# resolver's manifest, so the dependency becomes a real graph edge and a real symlink in
# transformers' private directory. (A pnpm patch of that manifest cannot do this — the
# graph is built before patches are applied to files.)
#
# The selector pins one exact transformers version and the version is exact, never a
# range. A range would keep applying this pin next to a future newer onnxruntime-web,
# installing a genuine second onnxruntime-common copy — two different `Tensor` classes,
# so `instanceof Tensor` fails across the boundary and inference breaks with no error
# pointing here. The exact selector fails safe instead: on a transformers bump the
# extension silently stops applying, resolution falls back to pnpm's private hoist dir as
# it did before this entry existed, and the build guard catches the version that ships.
#
# That guard is `checkOrtCommonVersion`, which reads the version below and asserts every
# ORT copy in a built bundle reports it. It is not a mirrored constant to be cleaned up:
# the only other declaration of this version lives in upstream's manifest, which no
# amount of sharing can reach, so the guard is the sole cross-check that the version
# declared here is the version that actually ships.
packageExtensions:
  '@huggingface/transformers@3.8.1':
    dependencies:
      onnxruntime-common: 1.22.0-dev.20250409-89f8206ba4

patchedDependencies:
  astro@5.18.2: patches/astro@5.18.2.patch
