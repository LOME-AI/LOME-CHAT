# Wrangler configuration for Cloudflare Workers
# Local dev requires no Cloudflare credentials

name = "hushbox-api"
main = "src/index.ts"
compatibility_date = "2026-03-01"
# web_socket_auto_reply_to_close: the runtime auto-sends a reciprocal Close frame
# echoing the peer's exact code/reason for hibernatable WebSockets — the
# hibernation-race-safe equivalent of legacy `ws.close(event.code, event.reason)`
# in webSocketClose. A targeted flag, NOT a compatibility_date bump (a date bump
# would enable unrelated behaviors, including a WS reason-byte limit that throws).
compatibility_flags = ["nodejs_compat", "web_socket_auto_reply_to_close"]

[dev]
local_protocol = "http"
# Deliberately off: Workers invocation logs capture full request URLs, which
# would record /admin/sql?query=… — the SQL panel's no-log posture depends on
# this staying disabled (or on URL scrubbing being added first).
[observability]
enabled = false

[limits]
cpu_ms = 30000
[durable_objects]
bindings = [
  { name = "CONVERSATION_ROOM", class_name = "ConversationRoom" },
  { name = "JOB_DISPATCHER", class_name = "JobDispatcher" },
]

[[migrations]]
tag = "v1"
new_classes = ["ConversationRoom"]

[[migrations]]
tag = "v2"
new_classes = ["JobDispatcher"]

# Mirrored by the schedule constants in src/scheduled.ts (asserted by test):
# every 15 min = jobs-health auditor; every 6 h = admin Access-log auditor;
# hourly = catalog poller, media GC, ledger-conservation + snapshot-drift
# auditors; daily = retention deletes + the admin audit digest.
[triggers]
crons = ["*/15 * * * *", "0 */6 * * *", "0 * * * *", "0 3 * * *"]
[[r2_buckets]]
binding = "APP_BUILDS"
bucket_name = "hushbox-app-builds"
# Admin plane: the SPA is served by a separate assets-only Worker on
# admin.hushbox.ai; its API traffic routes to THIS product Worker under the
# /api/* path (one hostname, one Access app covers SPA and API — ARCHITECTURE
# §Admin plane). The product apex (api.hushbox.ai) stays on its dashboard-configured
# custom domain; this route claims only the admin hostname's API path space.
[[routes]]
pattern = "admin.hushbox.ai/api/*"
zone_name = "hushbox.ai"
[vars]
NODE_ENV = "production"
API_URL = "https://api.hushbox.ai"
FRONTEND_URL = "https://hushbox.ai"
MARKETING_URL = "https://hushbox.ai"
ADMIN_URL = "https://admin.hushbox.ai"
VAPID_SUBJECT = "mailto:notifications@hushbox.ai"
R2_BUCKET_MEDIA = "hushbox-media"
TELEMETRY_SINKS = "console,sentry"

# Secrets deployed via CI (GitHub Secrets → wrangler secret put):
# - DATABASE_URL
# - UPSTASH_REDIS_REST_URL
# - UPSTASH_REDIS_REST_TOKEN
