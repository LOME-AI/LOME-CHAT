<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Frame-source allowlist for the bundled Capacitor WebView (iOS/Android). The
      generated _headers CSP governs frame-src on the web deployment, but static
      _headers never reach the assets bundled into the native app — so without this
      meta policy a sandboxed document inside the app could navigate its own frame
      to an arbitrary host and exfiltrate data in the URL. Vite substitutes the
      per-mode sandbox origin at build time; the directive mirrors the web
      _headers frame-src exactly ('self' + the document sandbox origin) so the two
      never diverge. Only frame-src is set here — no default-src — so this narrows
      framing without affecting any other resource load.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="frame-src 'self' %VITE_SANDBOX_ORIGIN_URL%"
    />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <!-- Installable-PWA manifest. iOS Safari has no web-push path without an
         installed (Home Screen) PWA, and navigator.setAppBadge only renders for
         an installed app; the apple-touch-icon is what iOS uses for the Home
         Screen icon. The service worker is push-only (see src/sw). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta
      name="description"
      content="One interface for every AI model. Chat with GPT, Claude, Gemini, and more. End-to-end encrypted. No subscriptions."
    />
    <!-- Apply the resolved theme class before first paint so an explicit
         themeMode that disagrees with the OS preference does not flash the wrong
         theme on cold load. Body kept in sync with the THEME_FLASH_SCRIPT module
         (parity asserted by theme-flash-script.test.ts) and mirrors the
         marketing ThemeScript resolution. -->
    <script>
      try {
        var saved = localStorage.getItem('themeMode');
        var osDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var dark = saved === 'dark' || (!saved && osDark);
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) {}
    </script>
    <!-- Apply stored accessibility preferences (contrast, font, spacing, motion)
         before first paint so the app does not flash un-adjusted styles on every
         load. Kept byte-identical in logic to A11Y_INIT_SCRIPT from
         @hushbox/ui/accessibility/init-script (parity asserted by
         a11y-flash-script.test.ts) and mirrors the marketing layouts, which
         inject the same constant. -->
    <script>
      (function () {
        try {
          var KEY = 'hushbox.a11y.v1';
          var html = document.documentElement;
          var add = function (name, on) {
            if (on) html.classList.add(name);
          };

          var osReducedMotion = false;
          try {
            osReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          } catch (e) {}

          var raw;
          try {
            raw = window.localStorage.getItem(KEY);
          } catch (e) {
            raw = null;
          }

          var s = null;
          if (raw) {
            try {
              var parsed = JSON.parse(raw);
              if (parsed && typeof parsed.state === 'object' && parsed.state !== null)
                s = parsed.state;
            } catch (e) {}
          }

          var storedStopAnimations = s !== null && s.stopAnimations === true;
          add('reduced-motion', osReducedMotion || storedStopAnimations);

          if (s === null) return;

          add('a11y-contrast-increased', s.contrast === 'increased');
          add('a11y-contrast-high', s.contrast === 'high');
          add('a11y-contrast-low', s.contrast === 'low');

          add('a11y-saturate-0', s.saturation === '0');
          add('a11y-saturate-50', s.saturation === '50');
          add('a11y-saturate-150', s.saturation === '150');

          add('a11y-cb-protan', s.colorblindSimulate === 'protan');
          add('a11y-cb-deutan', s.colorblindSimulate === 'deutan');
          add('a11y-cb-tritan', s.colorblindSimulate === 'tritan');
          add('a11y-cb-achroma', s.colorblindSimulate === 'achroma');
          add('a11y-cb-achromatomaly', s.colorblindSimulate === 'achromatomaly');

          add('a11y-font-scale-88', s.fontSize === '88');
          add('a11y-font-scale-112', s.fontSize === '112');
          add('a11y-font-scale-124', s.fontSize === '124');
          add('a11y-font-scale-141', s.fontSize === '141');

          add('a11y-letter-spacing-loose', s.letterSpacing === '0.05');
          add('a11y-letter-spacing-loosest', s.letterSpacing === '0.12');
          add('a11y-line-height-tight', s.lineHeight === '1.0');
          add('a11y-line-height-tall', s.lineHeight === '1.5');
          add('a11y-line-height-double', s.lineHeight === '2.0');
          add('a11y-para-spacing-double', s.paragraphSpacing === '2');

          add('a11y-cursor-large', s.cursorSize === 'large');
          add('a11y-cursor-xlarge', s.cursorSize === 'xlarge');
          add('a11y-cursor-white', s.cursorColor === 'white');

          add('a11y-focus-strong', s.focusWidth !== '0');
          add('a11y-focus-halo', s.focusHalo === true);

          if (s.focusWidth) html.style.setProperty('--a11y-focus-width', s.focusWidth + 'px');
          if (s.focusColor) html.style.setProperty('--a11y-focus-color', s.focusColor);

          // The @font-face rules live in the bundled accessibility CSS, emitted from a
          // single canonical woff2 source by each app's bundler. Pre-paint we only
          // toggle the class + set --a11y-font-family so typography.css's
          // font-family: var(--a11y-font-family) rule resolves the chosen family
          // before first paint. We deliberately drop the font-file preload head-start
          // here; the SETTING no longer flashes, only the (minor) file fetch is no
          // longer warmed by an inline link rel=preload.
          var validFonts = { atkinson: 1, 'open-dyslexic': 1, lexend: 1 };
          if (s.fontFamily && validFonts[s.fontFamily]) {
            add('a11y-font-override', true);
            html.style.setProperty('--a11y-font-family', '"' + s.fontFamily + '"');
          }
        } catch (e) {}
      })();
    </script>
    <!-- Paint the theme background before app CSS loads so there is no white
         flash (notably in dark mode / inside the marketing demo iframe). Values
         mirror the --background token in packages/config/tailwind/index.css. -->
    <style>
      :root {
        color-scheme: light dark;
        background-color: #faf9f6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          background-color: #1a1816;
        }
      }
    </style>
    <title>HushBox</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
