name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  # ── Version computation (main only) ────────────────────
  version:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 3
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      version: ${{ steps.compute.outputs.version }}
      version_name: ${{ steps.compute.outputs.version_name }}
      version_code: ${{ steps.compute.outputs.version_code }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-blacksmith
      - name: Compute next version
        id: compute
        run: pnpm tsx scripts/compute-next-version.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Quick lint jobs (Blacksmith 2 vCPU) ──────────────────
  lint:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-blacksmith
      - name: Generate Astro types
        run: pnpm --filter @hushbox/marketing exec astro sync
      - name: Lint
        run: pnpm lint
      - name: Architecture rules
        run: pnpm arch:check

  typecheck:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-blacksmith
      - name: Type check
        run: pnpm typecheck
      - name: Verify typecheck coverage
        run: pnpm verify:typecheck-coverage
      - name: Generate environment files
        run: pnpm generate:env
      - name: Drizzle migration drift check
        run: |
          pnpm --filter @hushbox/db db:generate
          git diff --exit-code packages/db/drizzle/ || (echo "Schema/snapshot drift. Run 'pnpm db:generate' and commit." && exit 1)

  duplication:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-blacksmith
      - name: Check code duplication
        run: pnpm lint:duplication

  unused:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-blacksmith
      - name: Generate environment files
        run: pnpm generate:env
      - name: Check unused code
        run: pnpm lint:unused

  gitleaks:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    environment: ci
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ── Test job (Blacksmith 4 vCPU + Docker) ────────────────
  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    environment: ci
    needs: [gitleaks]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-blacksmith

      - name: Cache Turbo
        uses: useblacksmith/cache@v5
        with:
          path: .turbo
          key: turbo-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.ref_name }}-
            turbo-main-

      - name: Cache Docker images
        uses: useblacksmith/stickydisk@v1
        with:
          key: docker-${{ hashFiles('docker-compose.yml') }}
          path: /tmp/docker-cache

      - name: Load cached Docker images
        run: |
          if ls /tmp/docker-cache/*.tar 1>/dev/null 2>&1; then
            echo "Loading cached Docker images..."
            for img in /tmp/docker-cache/*.tar; do
              docker load -i "$img" &
            done
            wait
          fi

      - name: Generate environment files
        run: pnpm generate:env --mode=ciVitest
        # BEGIN GENERATED: vitest-env
        env:
          OPENROUTER_API_KEY_RESTRICTED: ${{ secrets.OPENROUTER_API_KEY_RESTRICTED }}
          LINEAR_API_KEY_READ: ${{ secrets.LINEAR_API_KEY_READ }}
        # END GENERATED: vitest-env

      - name: Verify environment configuration
        run: pnpm verify:env --mode=ciVitest

      - name: Start database
        run: pnpm db:up

      - name: Save Docker images for next run
        run: |
          if ! ls /tmp/docker-cache/*.tar 1>/dev/null 2>&1; then
            mkdir -p /tmp/docker-cache
            docker save postgres:18-alpine -o /tmp/docker-cache/postgres.tar &
            docker save redis:7-alpine -o /tmp/docker-cache/redis.tar &
            docker save ghcr.io/neondatabase/wsproxy:latest -o /tmp/docker-cache/neon-proxy.tar &
            docker save hiett/serverless-redis-http:latest -o /tmp/docker-cache/serverless-redis.tar &
            docker save minio/minio:latest -o /tmp/docker-cache/minio.tar &
            docker save minio/mc:latest -o /tmp/docker-cache/minio-mc.tar &
            wait
          fi

      - name: Run migrations
        run: pnpm db:migrate

      - name: Verify hand-written DB objects
        run: pnpm verify:db-objects

      # HTTP cassettes — restore prior recordings of AI Gateway calls so most
      # integration tests replay from disk instead of hitting the gateway.
      # `restore-keys` does prefix-fallback to the most-recent prior run; the
      # unique save key below is then appended below. Bumping AI_RECORDING_VERSION
      # in the cassette store module changes the `v1` segment of the path and
      # orphans old recordings. See docs/CI-CASSETTES.md.
      - name: Restore AI cassettes
        uses: actions/cache/restore@v4
        with:
          path: .ai-cassettes
          key: ai-cassettes-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ai-cassettes-v1-

      # Worker-weights — CI keeps its own self-updating copy of the per-package
      # test-work weights (scripts/.cache/test-weights/<pkg>.json, gitignored).
      # A full `pnpm test` run rewrites these files; the allocator reads them to
      # size each package's worker pool next run. The unique save key below never
      # collides (actions/cache entries are immutable), so `restore-keys` prefix
      # fallback restores the most-recent prior weights and the save writes the
      # freshly-updated ones — a cache that updates every run instead of freezing.
      - name: Restore test worker-weights
        uses: actions/cache/restore@v4
        with:
          path: scripts/.cache/test-weights
          key: test-weights-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            test-weights-${{ runner.os }}-${{ github.ref_name }}-
            test-weights-${{ runner.os }}-main-
            test-weights-${{ runner.os }}-

      # Self-hosted Pyodide assets (~26 MB) the sandbox suite runs against. The
      # bytes are gitignored and fetched from a pinned CDN by the sandbox
      # `fetch-pyodide` turbo task (a dependency of its `test` task). Cache them
      # keyed on the fetch script's pins so the download happens once per pin
      # change; on a cache hit the fetch task's idempotency guard skips it.
      - name: Cache Pyodide assets
        uses: useblacksmith/cache@v5
        with:
          path: apps/sandbox/public/pyodide
          key: pyodide-${{ hashFiles('apps/sandbox/scripts/fetch-pyodide.sh') }}

      - name: Run tests
        run: pnpm test
        env:
          TURBO_FORCE: true

      # Assert the real external services were actually exercised, not mocked.
      - name: Verify OpenRouter was called
        run: pnpm verify:evidence --require=openrouter
      - name: Verify Linear was called
        run: pnpm verify:evidence --require=linear
      # Resend and FCM have no CI sandbox, so these assert the real adapter
      # send-and-record code path ran (against a mocked HTTP seam), not a live
      # provider call. Founder-verify/CI-pending: a real Resend/FCM sandbox call.
      - name: Verify Resend was called
        run: pnpm verify:evidence --require=resend
      - name: Verify FCM push was called
        run: pnpm verify:evidence --require=push-fcm

      # Save cassettes regardless of test outcome — fresh recordings from a
      # failed run are still valuable for the next attempt, and the cache key
      # is unique per run so a failed save doesn't poison main.
      - name: Save AI cassettes
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ai-cassettes
          key: ai-cassettes-v1-${{ github.run_id }}-${{ github.run_attempt }}

      # Persist the weights this run just rewrote under a fresh, never-colliding
      # key so the next run's restore-keys prefix fallback picks them up. Saved
      # even on failure — carrying the restored weights forward is harmless and
      # a partial recording is still a better signal than none.
      - name: Save test worker-weights
        if: always()
        uses: actions/cache/save@v4
        with:
          path: scripts/.cache/test-weights
          key: test-weights-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

  # ── Build job (Blacksmith 4 vCPU) ────────────────────────
  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 8
    environment: ci
    needs: [gitleaks, version]
    if: always() && needs.gitleaks.result == 'success' && (needs.version.result == 'success' || needs.version.result == 'skipped')
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-blacksmith

      - name: Cache Turbo
        uses: useblacksmith/cache@v5
        with:
          path: .turbo
          key: turbo-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.ref_name }}-
            turbo-main-

      - name: Verify production environment
        run: pnpm verify:env --mode=production

      # The sandbox origin's dist ships the self-hosted Pyodide assets (~26 MB,
      # gitignored), pulled from a pinned CDN by the `fetch-pyodide` turbo task
      # that `build` depends on. Cache them on the fetch script's pins so the
      # download happens once per pin change; on a hit the fetch task's
      # idempotency guard skips it.
      - name: Cache Pyodide assets
        uses: useblacksmith/cache@v5
        with:
          path: apps/sandbox/public/pyodide
          key: pyodide-${{ hashFiles('apps/sandbox/scripts/fetch-pyodide.sh') }}

      - name: Build
        run: pnpm build
        # BEGIN GENERATED: build-env
        env:
          ESM_CDN_URL: https://esm.sh
          VITE_SANDBOX_ORIGIN_URL: https://sandbox.hushbox.ai
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_API_URL: https://api.hushbox.ai
          VITE_HELCIM_JS_TOKEN: ${{ secrets.VITE_HELCIM_JS_TOKEN_PRODUCTION }}
          VITE_PLATFORM: web
          VITE_APP_VERSION: ${{ needs.version.outputs.version }}
          VITE_WEB_URL: https://hushbox.ai
        # END GENERATED: build-env

      - name: Merge marketing into web dist
        run: pnpm tsx scripts/merge-marketing-into-web.ts

      - name: Generate _headers (CSP hashes per marketing route)
        run: pnpm tsx scripts/generate-headers.ts
        # generate-headers.ts bakes VITE_API_URL into the CSP connect-src, so it
        # must match the API origin the client bundles were built against above.
        # BEGIN GENERATED: headers-env
        env:
          VITE_API_URL: https://api.hushbox.ai
          SANDBOX_ORIGIN_URL: https://sandbox.hushbox.ai
        # END GENERATED: headers-env

      - name: Upload web build artifact
        uses: actions/upload-artifact@v6
        with:
          name: web-dist
          path: apps/web/dist

      - name: Upload admin build artifact
        uses: actions/upload-artifact@v6
        with:
          name: admin-dist
          path: apps/admin/dist

      # The sandbox origin is deployed from this dist (static pages + Pyodide +
      # the env-derived config.js); the deploy job never builds, so it travels
      # as an artifact like the web and admin bundles.
      - name: Upload sandbox build artifact
        uses: actions/upload-artifact@v6
        with:
          name: sandbox-dist
          path: apps/sandbox/dist

      - name: Build mobile OTA bundles (parallel)
        if: needs.version.result == 'success'
        # The subshell inherits the generated frontend env below; only
        # VITE_PLATFORM varies per bundle, so the loop sets it inline (it
        # overrides the block's base value).
        run: |
          for platform in ios android android-direct; do
            (
              VITE_PLATFORM=$platform \
              pnpm --filter web exec vite build --outDir dist-$platform
            ) &
          done
          wait
        # BEGIN GENERATED: build-env-mobile
        env:
          VITE_SANDBOX_ORIGIN_URL: https://sandbox.hushbox.ai
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_API_URL: https://api.hushbox.ai
          VITE_HELCIM_JS_TOKEN: ${{ secrets.VITE_HELCIM_JS_TOKEN_PRODUCTION }}
          VITE_PLATFORM: web
          VITE_APP_VERSION: ${{ needs.version.outputs.version }}
          VITE_WEB_URL: https://hushbox.ai
        # END GENERATED: build-env-mobile

      - name: Upload mobile build artifacts
        if: needs.version.result == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: mobile-dist
          path: |
            apps/web/dist-ios
            apps/web/dist-android
            apps/web/dist-android-direct

  # ── E2E tests (Blacksmith 4 vCPU + Docker + Playwright) ──
  # Builds the merged dev-mode web bundle ONCE; every e2e leg below reuses it
  # instead of rebuilding it (6 cold builds -> 1). `build:e2e` is the single
  # build path: it self-generates the ciE2E env, Turbo-builds web + marketing in
  # parallel, merges marketing into web, and writes _headers. No DB/stack needed
  # (static build), so this job stays lean.
  e2e-build:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    environment: ci
    needs: [gitleaks]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-blacksmith

      - name: Cache Turbo
        uses: useblacksmith/cache@v5
        with:
          path: .turbo
          # Separate key from the prod `build` job: the e2e bundle is dev-mode,
          # a distinct Turbo hash, and must not clobber the prod cache entry.
          key: turbo-e2e-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-e2e-${{ github.ref_name }}-
            turbo-e2e-main-

      - name: Build merged e2e web bundle
        run: pnpm build:e2e
        # BEGIN GENERATED: e2e-build-env
        env:
          NODE_ENV: development
          VITE_HELCIM_JS_TOKEN_SANDBOX: ${{ secrets.VITE_HELCIM_JS_TOKEN_SANDBOX }}
        # END GENERATED: e2e-build-env

      - name: Upload e2e web bundle
        uses: actions/upload-artifact@v6
        with:
          name: e2e-web-dist
          path: apps/web/dist
          retention-days: 1

      # E2E-mode admin bundle (VITE_E2E baked, dev-mode). Distinct from the
      # deploy job's production `admin-dist` artifact — different build, must
      # never be confused with or overwrite it. NODE_ENV is required by
      # createEnvUtilities; mode (CiE2E) is selected from isCI at runtime.
      - name: Build e2e admin bundle
        run: pnpm build:e2e:admin
        env:
          NODE_ENV: development

      - name: Upload e2e admin bundle
        uses: actions/upload-artifact@v6
        with:
          name: admin-e2e-dist
          path: apps/admin/dist
          retention-days: 1

  e2e:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 20
    environment: ci
    needs: [gitleaks, e2e-build]
    strategy:
      fail-fast: true
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: firefox
            browser: firefox
          - project: webkit
            browser: webkit
          - project: iphone-15
            browser: webkit
          - project: pixel-7
            browser: chromium
          - project: ipad-pro
            browser: webkit
          - project: admin
            browser: chromium
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-blacksmith

      - name: Resolve Playwright version
        id: playwright-version
        run: |
          VERSION=$(node -p "require('./node_modules/@playwright/test/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Playwright version: $VERSION"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: useblacksmith/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser }}-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            playwright-${{ matrix.browser }}-

      - name: Cache Docker images
        uses: useblacksmith/stickydisk@v1
        with:
          key: docker-${{ hashFiles('docker-compose.yml') }}
          path: /tmp/docker-cache

      - name: Load cached Docker images
        run: |
          if ls /tmp/docker-cache/*.tar 1>/dev/null 2>&1; then
            for img in /tmp/docker-cache/*.tar; do
              docker load -i "$img" &
            done
            wait
          fi

      - name: Generate environment files
        run: pnpm generate:env --mode=ciE2E
        # BEGIN GENERATED: e2e-env
        env:
          HELCIM_API_TOKEN_SANDBOX: ${{ secrets.HELCIM_API_TOKEN_SANDBOX }}
          HELCIM_WEBHOOK_VERIFIER_SANDBOX: ${{ secrets.HELCIM_WEBHOOK_VERIFIER_SANDBOX }}
          VITE_HELCIM_JS_TOKEN_SANDBOX: ${{ secrets.VITE_HELCIM_JS_TOKEN_SANDBOX }}
        # END GENERATED: e2e-env

      - name: Verify environment configuration
        run: pnpm verify:env --mode=ciE2E

      - name: Install Playwright system deps
        run: pnpm exec playwright install-deps ${{ matrix.browser }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install ${{ matrix.browser }}

      - name: Install Hookdeck CLI
        if: matrix.project == 'chromium'
        run: |
          npm install -g hookdeck-cli
          hookdeck version

      - name: Start database
        run: pnpm db:up

      - name: Save Docker images for next run
        run: |
          if ! ls /tmp/docker-cache/*.tar 1>/dev/null 2>&1; then
            mkdir -p /tmp/docker-cache
            docker save postgres:18-alpine -o /tmp/docker-cache/postgres.tar &
            docker save redis:7-alpine -o /tmp/docker-cache/redis.tar &
            docker save ghcr.io/neondatabase/wsproxy:latest -o /tmp/docker-cache/neon-proxy.tar &
            docker save hiett/serverless-redis-http:latest -o /tmp/docker-cache/serverless-redis.tar &
            docker save minio/minio:latest -o /tmp/docker-cache/minio.tar &
            docker save minio/mc:latest -o /tmp/docker-cache/minio-mc.tar &
            wait
          fi

      - name: Run migrations
        run: pnpm db:migrate

      - name: Seed test data
        run: pnpm db:seed

      - name: Start Hookdeck listener
        if: matrix.project == 'chromium'
        run: |
          hookdeck ci --api-key $HOOKDECK_API_KEY
          hookdeck listen 8787 helcim-sandbox --path /api/webhooks/payment --output compact 2>&1 | tee /tmp/hookdeck.log &
          for i in {1..60}; do
            if grep -q -E "(Listening|Webhook URL|forwarding)" /tmp/hookdeck.log 2>/dev/null; then
              echo "Hookdeck listener ready"
              cat /tmp/hookdeck.log
              break
            fi
            if grep -q -i "error\|unknown\|failed" /tmp/hookdeck.log 2>/dev/null; then
              echo "Hookdeck failed to start:"
              cat /tmp/hookdeck.log
              exit 1
            fi
            echo "Waiting for Hookdeck listener... ($i/60)"
            sleep 1
          done
          if ! grep -q -E "(Listening|Webhook URL|forwarding)" /tmp/hookdeck.log 2>/dev/null; then
            echo "Hookdeck failed to start within timeout"
            cat /tmp/hookdeck.log
            exit 1
          fi
        env:
          HOOKDECK_API_KEY: ${{ secrets.HOOKDECK_API_KEY }}

      - name: Download prebuilt e2e web bundle
        uses: actions/download-artifact@v6
        with:
          name: e2e-web-dist
          path: apps/web/dist

      # Tag-based gating via Playwright --grep-invert, which composes (AND) with
      # the project-level grepInvert in playwright.config.ts. CI always drops
      # @local-only (dev-mode-only tests); every project except chromium also
      # drops @webhook, so the full-payment flow runs on the chromium runner
      # alone (Hookdeck + Helcim sandbox are wired there only).
      - name: Download prebuilt e2e web bundle
        uses: actions/download-artifact@v6
        with:
          name: e2e-web-dist
          path: apps/web/dist

      # The admin webServer (playwright.config.ts) reads the same HB_E2E_PREBUILT
      # flag and serves this prebuilt dist via vite preview instead of rebuilding.
      - name: Download prebuilt e2e admin bundle
        uses: actions/download-artifact@v6
        with:
          name: admin-e2e-dist
          path: apps/admin/dist

      # The document-rendering E2E specs load the sandbox origin, which serves the
      # self-hosted Pyodide assets (~26 MB, gitignored). Cache them on the fetch
      # script's pins and fetch on a cache miss; the fetch is idempotent (skips
      # when the pinned set is already present).
      - name: Cache Pyodide assets
        uses: useblacksmith/cache@v5
        with:
          path: apps/sandbox/public/pyodide
          key: pyodide-${{ hashFiles('apps/sandbox/scripts/fetch-pyodide.sh') }}

      - name: Fetch Pyodide assets
        run: pnpm --filter @hushbox/sandbox fetch-pyodide

      - name: Run E2E tests (${{ matrix.project }})
        run: pnpm e2e --project=${{ matrix.project }} --grep-invert "$E2E_GREP_INVERT"
        env:
          CI: true
          # The bundle was built once by the e2e-build job and downloaded above;
          # Playwright's webServer skips build:e2e and serves it via vite preview.
          HB_E2E_PREBUILT: '1'
          SKIP_WEBHOOK_TESTS: ${{ matrix.project != 'chromium' && 'true' || '' }}
          E2E_GREP_INVERT: ${{ matrix.project == 'chromium' && '@local-only' || '@local-only|@webhook' }}

      # Assert the real external services were actually exercised, not mocked.
      # Only the chromium leg wires Hookdeck and the Helcim sandbox.
      - name: Verify Hookdeck was called
        if: matrix.project == 'chromium'
        run: pnpm verify:evidence --require=hookdeck
      - name: Verify Helcim was called
        if: matrix.project == 'chromium'
        run: pnpm verify:evidence --require=helcim

      - name: Upload Playwright report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7

      - name: Cancel workflow run on failure
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Mobile tests (Maestro + Android emulator via Docker) ──
  mobile-test:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 20
    environment: ci
    needs: [gitleaks]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-blacksmith

      - name: Cache Turbo
        uses: useblacksmith/cache@v5
        with:
          path: .turbo
          key: turbo-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.ref_name }}-
            turbo-main-

      - name: Cache Android SDK
        uses: useblacksmith/cache@v5
        with:
          path: ~/Android/Sdk
          key: android-sdk-android-36-cmdtools-11076708

      - name: Cache Gradle
        uses: useblacksmith/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('apps/web/android/gradle/wrapper/gradle-wrapper.properties', 'apps/web/android/**/*.gradle') }}
          restore-keys: |
            gradle-

      - name: Cache Maestro CLI
        uses: useblacksmith/cache@v5
        with:
          path: ~/.maestro
          key: maestro-cli

      - name: Generate environment files
        run: pnpm generate:env --mode=ciE2E
        # BEGIN GENERATED: e2e-env
        env:
          HELCIM_API_TOKEN_SANDBOX: ${{ secrets.HELCIM_API_TOKEN_SANDBOX }}
          HELCIM_WEBHOOK_VERIFIER_SANDBOX: ${{ secrets.HELCIM_WEBHOOK_VERIFIER_SANDBOX }}
          VITE_HELCIM_JS_TOKEN_SANDBOX: ${{ secrets.VITE_HELCIM_JS_TOKEN_SANDBOX }}
        # END GENERATED: e2e-env

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Logs into GHCR so the script can pull the warm content-hash image
      # pushed by push-mobile-emulator-image on main. PRs that change the
      # Dockerfile miss the registry and fall back to a local cold build,
      # which doesn't require login.
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start database
        run: pnpm db:up

      - name: Run migrations
        run: pnpm db:migrate

      - name: Seed test data
        # The unified seed mints MOBILE_TEST_PERSONA alongside everything else.
        run: pnpm db:seed

      - name: Run mobile tests
        run: pnpm mobile:test

      - name: Dump emulator logs
        if: failure()
        # Iterate every container matching the shard name prefix so this scales
        # automatically with mobile-tests/config.ts SHARDS — no need to update
        # CI when the constant changes.
        run: |
          docker ps -aq --filter "name=hushbox-mobile-emulator-shard-" | while read -r id; do
            [ -z "$id" ] && continue
            name=$(docker inspect --format '{{.Name}}' "$id" | sed 's|^/||')
            docker logs "$id" > "emulator-logs-$name.txt" 2>&1 || true
            docker inspect "$id" > "emulator-inspect-$name.json" 2>&1 || true
          done

      - name: Upload results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: maestro-results
          path: |
            maestro-results/
            emulator-logs-*.txt
            emulator-inspect-*.json
          retention-days: 7

      - name: Cancel workflow run on failure
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Push mobile-emulator image to GHCR (in parallel with deploy) ──
  # Bakes mobile-tests/docker/ into a content-hashed image with an AVD
  # quick-boot snapshot and pushes to GHCR. Skips push when the content-hash
  # tag already exists in the registry (no-op when the Dockerfile didn't
  # change). Gated by the same checks as deploy so the registry only ever
  # holds artifacts that pass the full check suite.
  push-mobile-emulator-image:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    needs: [lint, typecheck, duplication, unused, test, build, e2e, mobile-test, version]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-blacksmith

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bake and push mobile emulator image
        run: pnpm tsx scripts/bake-mobile-image.ts --push

  # ── Deploy (GitHub-hosted — hyper-secrets) ───────────────
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, typecheck, duplication, unused, test, build, e2e, mobile-test, version]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    # BEGIN GENERATED: ops-env
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NODE_ENV: production
      API_URL: https://api.hushbox.ai
      FRONTEND_URL: https://hushbox.ai
      MARKETING_URL: https://hushbox.ai
      ADMIN_URL: https://admin.hushbox.ai
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      OPAQUE_MASTER_SECRET: ${{ secrets.OPAQUE_MASTER_SECRET }}
      IRON_SESSION_SECRET: ${{ secrets.IRON_SESSION_SECRET }}
      CF_ACCESS_TEAM_DOMAIN: ${{ secrets.CF_ACCESS_TEAM_DOMAIN }}
      CF_ACCESS_AUD: ${{ secrets.CF_ACCESS_AUD }}
      ADMIN_ACTOR_ALLOWLIST: ${{ secrets.ADMIN_ACTOR_ALLOWLIST }}
      ADMIN_SQL_PANEL_DATABASE_URL: ${{ secrets.ADMIN_SQL_PANEL_DATABASE_URL }}
      CLOUDFLARE_ACCESS_LOG_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_LOG_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APP_VERSION: ${{ needs.version.outputs.version }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_PRODUCTION }}
      FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
      FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: mailto:notifications@hushbox.ai
      NOTIFICATION_TAG_SECRET: ${{ secrets.NOTIFICATION_TAG_SECRET }}
      HELCIM_API_TOKEN: ${{ secrets.HELCIM_API_TOKEN_PRODUCTION }}
      LINEAR_API_KEY_READ: ${{ secrets.LINEAR_API_KEY_READ }}
      HELCIM_WEBHOOK_VERIFIER: ${{ secrets.HELCIM_WEBHOOK_VERIFIER_PRODUCTION }}
      R2_S3_ENDPOINT: ${{ secrets.R2_S3_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_MEDIA: hushbox-media
      TELEMETRY_SINKS: console,sentry
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      R2_ADMIN_ACCESS_KEY_ID: ${{ secrets.R2_ADMIN_ACCESS_KEY_ID }}
      R2_ADMIN_SECRET_ACCESS_KEY: ${{ secrets.R2_ADMIN_SECRET_ACCESS_KEY }}
    # END GENERATED: ops-env
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - name: Verify version
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          if [ -z "$VERSION" ]; then
            echo "ERROR: Version is empty"
            exit 1
          fi
          echo "Deploying version: $VERSION"

      - name: Download web build artifact
        uses: actions/download-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist

      # The deep-link association files ship literal placeholders in the repo —
      # `TEAMID` in the AASA appID and `PLACEHOLDER_SHA256_FINGERPRINT` in the
      # Android assetlinks. iOS Universal Links and Android App Links only
      # verify against the real Apple Team ID + release signing SHA-256, so
      # substitute them into the merged web dist (served as static assets on
      # Pages) before deploy, then guard that no placeholder survived. Runs
      # before every deploy action so a mis-set secret fails the job with
      # nothing published.
      # values-pending: APPLE_TEAM_ID and ANDROID_CERT_SHA256_FINGERPRINT are
      # founder-supplied production secrets and may not exist yet.
      - name: Substitute deep-link association files
        run: |
          set -euo pipefail
          well_known="apps/web/dist/.well-known"
          aasa="$well_known/apple-app-site-association"
          assetlinks="$well_known/assetlinks.json"
          if [ -z "${APPLE_TEAM_ID:-}" ]; then
            echo "ERROR: APPLE_TEAM_ID secret is empty"
            exit 1
          fi
          if [ -z "${ANDROID_CERT_SHA256_FINGERPRINT:-}" ]; then
            echo "ERROR: ANDROID_CERT_SHA256_FINGERPRINT secret is empty"
            exit 1
          fi
          for f in "$aasa" "$assetlinks"; do
            if [ ! -f "$f" ]; then
              echo "ERROR: expected association file missing: $f"
              exit 1
            fi
          done
          sed -i "s/TEAMID/${APPLE_TEAM_ID}/g" "$aasa"
          sed -i "s/PLACEHOLDER_SHA256_FINGERPRINT/${ANDROID_CERT_SHA256_FINGERPRINT}/g" "$assetlinks"
          # Structure must survive substitution — both files must stay valid JSON.
          jq empty "$aasa"
          jq empty "$assetlinks"
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ANDROID_CERT_SHA256_FINGERPRINT: ${{ secrets.ANDROID_CERT_SHA256_FINGERPRINT }}

      - name: Guard deep-link placeholders substituted
        run: |
          set -euo pipefail
          well_known="apps/web/dist/.well-known"
          if grep -R -E 'TEAMID|PLACEHOLDER_SHA256_FINGERPRINT' "$well_known"; then
            echo "ERROR: deep-link association placeholder still present after substitution"
            exit 1
          fi
          echo "Deep-link association placeholders substituted"

      - name: Download admin build artifact
        uses: actions/download-artifact@v7
        with:
          name: admin-dist
          path: apps/admin/dist

      - name: Download sandbox build artifact
        uses: actions/download-artifact@v7
        with:
          name: sandbox-dist
          path: apps/sandbox/dist

      # Publish-then-promote: the OTA bundle + per-platform checksums must exist
      # in R2 / as worker secrets BEFORE APP_VERSION is set. Setting APP_VERSION
      # (below) is what makes /updates/current advertise the new version; if the
      # bundle and checksum weren't already published, that window advertises a
      # version whose download 404s and whose checksum is stale. These two steps
      # depend only on the mobile-dist artifact + CF creds + the resolved
      # version — never on the worker being deployed — so they run first.
      - name: Download mobile build artifacts
        uses: actions/download-artifact@v7
        with:
          name: mobile-dist
          path: apps/web

      - name: Upload mobile OTA bundles to R2
        working-directory: apps/api
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          for platform in ios android android-direct; do
            (cd ../../apps/web/dist-$platform && zip -r ../../../${platform}-dist.zip .)
            pnpm exec wrangler r2 object put \
              "hushbox-app-builds/builds/$platform/$VERSION.zip" \
              --file ../../${platform}-dist.zip --remote
            echo "Uploaded builds/$platform/$VERSION.zip"
            # Publish the bundle's sha256 as the per-platform checksum binding
            # (wrangler secret put, mirroring APP_VERSION). Served on
            # /updates/current so the native client can integrity-check the
            # download before applying it. Each platform's zip has a distinct
            # sha256 (distinct VITE_PLATFORM build), so the binding is per platform.
            CHECKSUM=$(sha256sum ../../${platform}-dist.zip | cut -d' ' -f1)
            PLATFORM_KEY=$(echo "$platform" | tr '[:lower:]-' '[:upper:]_')
            echo "$CHECKSUM" | pnpm exec wrangler secret put "APP_BUNDLE_CHECKSUM_${PLATFORM_KEY}"
            echo "Published APP_BUNDLE_CHECKSUM_${PLATFORM_KEY}"
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy secrets to Workers
        working-directory: apps/api
        run: |
          # BEGIN GENERATED: deploy-secrets
          echo "${{ secrets.DATABASE_URL }}" | pnpm exec wrangler secret put DATABASE_URL
          echo "${{ secrets.UPSTASH_REDIS_REST_URL }}" | pnpm exec wrangler secret put UPSTASH_REDIS_REST_URL
          echo "${{ secrets.UPSTASH_REDIS_REST_TOKEN }}" | pnpm exec wrangler secret put UPSTASH_REDIS_REST_TOKEN
          echo "${{ secrets.OPAQUE_MASTER_SECRET }}" | pnpm exec wrangler secret put OPAQUE_MASTER_SECRET
          echo "${{ secrets.IRON_SESSION_SECRET }}" | pnpm exec wrangler secret put IRON_SESSION_SECRET
          echo "${{ secrets.CF_ACCESS_TEAM_DOMAIN }}" | pnpm exec wrangler secret put CF_ACCESS_TEAM_DOMAIN
          echo "${{ secrets.CF_ACCESS_AUD }}" | pnpm exec wrangler secret put CF_ACCESS_AUD
          echo "${{ secrets.ADMIN_ACTOR_ALLOWLIST }}" | pnpm exec wrangler secret put ADMIN_ACTOR_ALLOWLIST
          echo "${{ secrets.ADMIN_SQL_PANEL_DATABASE_URL }}" | pnpm exec wrangler secret put ADMIN_SQL_PANEL_DATABASE_URL
          echo "${{ secrets.CLOUDFLARE_ACCESS_LOG_API_TOKEN }}" | pnpm exec wrangler secret put CLOUDFLARE_ACCESS_LOG_API_TOKEN
          echo "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" | pnpm exec wrangler secret put CLOUDFLARE_ACCOUNT_ID
          echo "${{ needs.version.outputs.version }}" | pnpm exec wrangler secret put APP_VERSION
          echo "${{ secrets.RESEND_API_KEY }}" | pnpm exec wrangler secret put RESEND_API_KEY
          echo "${{ secrets.RESEND_WEBHOOK_SECRET }}" | pnpm exec wrangler secret put RESEND_WEBHOOK_SECRET
          echo "${{ secrets.OPENROUTER_API_KEY_PRODUCTION }}" | pnpm exec wrangler secret put OPENROUTER_API_KEY
          echo "${{ secrets.FCM_PROJECT_ID }}" | pnpm exec wrangler secret put FCM_PROJECT_ID
          echo "${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}" | pnpm exec wrangler secret put FCM_SERVICE_ACCOUNT_JSON
          echo "${{ secrets.VAPID_PUBLIC_KEY }}" | pnpm exec wrangler secret put VAPID_PUBLIC_KEY
          echo "${{ secrets.VAPID_PRIVATE_KEY }}" | pnpm exec wrangler secret put VAPID_PRIVATE_KEY
          echo "${{ secrets.NOTIFICATION_TAG_SECRET }}" | pnpm exec wrangler secret put NOTIFICATION_TAG_SECRET
          echo "${{ secrets.HELCIM_API_TOKEN_PRODUCTION }}" | pnpm exec wrangler secret put HELCIM_API_TOKEN
          echo "${{ secrets.LINEAR_API_KEY_READ }}" | pnpm exec wrangler secret put LINEAR_API_KEY_READ
          echo "${{ secrets.HELCIM_WEBHOOK_VERIFIER_PRODUCTION }}" | pnpm exec wrangler secret put HELCIM_WEBHOOK_VERIFIER
          echo "${{ secrets.R2_S3_ENDPOINT }}" | pnpm exec wrangler secret put R2_S3_ENDPOINT
          echo "${{ secrets.R2_ACCESS_KEY_ID }}" | pnpm exec wrangler secret put R2_ACCESS_KEY_ID
          echo "${{ secrets.R2_SECRET_ACCESS_KEY }}" | pnpm exec wrangler secret put R2_SECRET_ACCESS_KEY
          echo "${{ secrets.SENTRY_DSN }}" | pnpm exec wrangler secret put SENTRY_DSN
          # END GENERATED: deploy-secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify secrets deployed
        working-directory: apps/api
        run: |
          secrets=$(pnpm exec wrangler secret list)
          # BEGIN GENERATED: verify-secrets
          for secret in DATABASE_URL UPSTASH_REDIS_REST_URL UPSTASH_REDIS_REST_TOKEN OPAQUE_MASTER_SECRET IRON_SESSION_SECRET CF_ACCESS_TEAM_DOMAIN CF_ACCESS_AUD ADMIN_ACTOR_ALLOWLIST ADMIN_SQL_PANEL_DATABASE_URL CLOUDFLARE_ACCESS_LOG_API_TOKEN CLOUDFLARE_ACCOUNT_ID APP_VERSION RESEND_API_KEY RESEND_WEBHOOK_SECRET OPENROUTER_API_KEY FCM_PROJECT_ID FCM_SERVICE_ACCOUNT_JSON VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY NOTIFICATION_TAG_SECRET HELCIM_API_TOKEN LINEAR_API_KEY_READ HELCIM_WEBHOOK_VERIFIER R2_S3_ENDPOINT R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY SENTRY_DSN; do
          # END GENERATED: verify-secrets
            if ! echo "$secrets" | grep -q "$secret"; then
              echo "ERROR: Secret $secret not found in Workers"
              exit 1
            fi
          done
          echo "All required secrets verified"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Resolve any `run-script:<name>` labels on the merged PR against
      # ops/manifest.yml, validate them, and partition by phase. Outputs
      # JSON arrays consumed by the pre-deploy and post-deploy steps below.
      # See ops/README.md for the trust model.
      #
      # Implemented as a tsx script (not actions/github-script) so the
      # workspace's js-yaml is resolvable — pnpm doesn't hoist devDeps to
      # the repo root.
      - name: Resolve ops scripts from PR labels
        id: ops
        run: pnpm tsx ops/lib/resolve-pr-scripts.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Run pre-deploy ops scripts
        if: steps.ops.outputs.pre != '' && steps.ops.outputs.pre != '[]'
        run: |
          echo '${{ steps.ops.outputs.pre }}' | jq -c '.[]' | while read -r s; do
            name=$(echo "$s" | jq -r '.name')
            file=$(echo "$s" | jq -r '.file')
            echo "::group::Pre-deploy ops script: $name ($file)"
            pnpm tsx "$file"
            echo "::endgroup::"
          done

      - name: Run database migrations (production)
        run: pnpm --filter @hushbox/db db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy API to Workers
        working-directory: apps/api
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Web to Pages
        working-directory: apps/web
        run: pnpm exec wrangler pages deploy dist --project-name=hushbox
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Admin assets Worker
        working-directory: apps/admin
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Sandbox assets Worker
        working-directory: apps/sandbox
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Run post-deploy ops scripts
        if: steps.ops.outputs.post != '' && steps.ops.outputs.post != '[]'
        run: |
          echo '${{ steps.ops.outputs.post }}' | jq -c '.[]' | while read -r s; do
            name=$(echo "$s" | jq -r '.name')
            file=$(echo "$s" | jq -r '.file')
            echo "::group::Post-deploy ops script: $name ($file)"
            pnpm tsx "$file"
            echo "::endgroup::"
          done

      # Verify against the REAL production host (api.hushbox.ai, the job-level
      # API_URL), not the workers.dev subdomain — and assert the thing that just
      # changed is actually live: the deployed APP_VERSION is serving AND the OTA
      # manifest is coherent (/updates/current reports that same version with a
      # live per-platform checksum, published to R2 + as a worker secret before
      # APP_VERSION flipped). This step precedes "Tag release" with no
      # `if: always()`, so a failed assertion fails the job and gates the tag —
      # a bad or OTA-incoherent deploy never gets tagged.
      #
      # Founder/CI-verify: this runs against production only on a real `main`
      # deploy; the assertions are exercised for the first time there.
      - name: Verify API health (real host + version/OTA assert)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$VERSION" ]; then
            echo "ERROR: resolved version is empty"
            exit 1
          fi
          # Poll for liveness — allow for edge propagation after wrangler deploy.
          for attempt in $(seq 1 12); do
            if curl -fsS "$API_URL/health" >/dev/null; then
              echo "Health endpoint live on $API_URL (attempt $attempt)"
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "ERROR: $API_URL/health never became healthy"
              exit 1
            fi
            sleep 5
          done
          # Assert the deployed version is serving and OTA is coherent. The
          # checksum is per-platform (distinct VITE_PLATFORM builds); ios is
          # representative — all three platforms were published in the same step.
          for attempt in $(seq 1 12); do
            body=$(curl -fsS -H 'X-HushBox-Platform: ios' "$API_URL/updates/current") || body=''
            served=$(printf '%s' "$body" | jq -r '.version // empty')
            checksum=$(printf '%s' "$body" | jq -r '.checksum // empty')
            if [ "$served" = "$VERSION" ] && [ -n "$checksum" ]; then
              echo "Serving version $served with live checksum $checksum"
              exit 0
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "ERROR: /updates/current reports version='$served' checksum='$checksum'; expected version='$VERSION' with a non-empty checksum"
              exit 1
            fi
            sleep 5
          done

      - name: Tag release
        run: |
          git tag "v${{ needs.version.outputs.version }}"
          git push origin "v${{ needs.version.outputs.version }}"
        env:
          HUSKY: '0'
