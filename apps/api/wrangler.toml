# Wrangler configuration for Cloudflare Workers
# Local dev requires no Cloudflare credentials

name = "hushbox-api"
main = "src/index.ts"
compatibility_date = "2026-03-01"
compatibility_flags = ["nodejs_compat"]

[dev]
local_protocol = "http"
[observability]
enabled = false

[limits]
cpu_ms = 30000
[durable_objects]
bindings = [
  { name = "CONVERSATION_ROOM", class_name = "ConversationRoom" },
  { name = "JOB_DISPATCHER", class_name = "JobDispatcher" },
]

[[migrations]]
tag = "v1"
new_classes = ["ConversationRoom"]

[[migrations]]
tag = "v2"
new_classes = ["JobDispatcher"]

# Mirrored by the schedule constants in src/scheduled.ts (asserted by test):
# every 15 min = jobs-health auditor; hourly = catalog poller, media GC,
# ledger-conservation + snapshot-drift auditors; daily = retention deletes.
[triggers]
crons = ["*/15 * * * *", "0 * * * *", "0 3 * * *"]
[[r2_buckets]]
binding = "APP_BUILDS"
bucket_name = "hushbox-app-builds"
[[analytics_engine_datasets]]
binding = "WAE_METRICS"
dataset = "hushbox_metrics"
[vars]
NODE_ENV = "production"
API_URL = "https://api.hushbox.ai"
FRONTEND_URL = "https://hushbox.ai"
PUBLIC_MODELS_URL = "https://ai-gateway.vercel.sh/v1/models"
R2_BUCKET_MEDIA = "hushbox-media"
TELEMETRY_SINKS = "console,sentry,wae"

# Secrets deployed via CI (GitHub Secrets → wrangler secret put):
# - DATABASE_URL
# - UPSTASH_REDIS_REST_URL
# - UPSTASH_REDIS_REST_TOKEN
# - OPAQUE_MASTER_SECRET
# - IRON_SESSION_SECRET
# - APP_VERSION
# - RESEND_API_KEY
# - OPENROUTER_API_KEY
# - FCM_PROJECT_ID
# - FCM_SERVICE_ACCOUNT_JSON
# - HELCIM_API_TOKEN
# - LINEAR_API_KEY_READ
# - HELCIM_WEBHOOK_VERIFIER
# - R2_S3_ENDPOINT
# - R2_ACCESS_KEY_ID
# - R2_SECRET_ACCESS_KEY
# - SENTRY_DSN
